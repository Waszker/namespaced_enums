name: Publish to TestPyPI

# Manual dry-run of the release pipeline against TestPyPI. Trigger it from the
# Actions tab ("Run workflow"). The button only appears once this file is on the
# default branch. `skip-existing` avoids failures when a version is already there.
on:
  workflow_dispatch:

jobs:
  publish-test:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      # Required for trusted publishing (OIDC) — no API token/secret needed.
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
